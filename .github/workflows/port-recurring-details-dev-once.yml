name: Port Recurring Details Dev Once

on:
  push:
    branches:
      - feature/cleaning-suite-dev
    paths:
      - '.github/workflows/port-recurring-details-dev-once.yml'
      - 'scripts/port_recurring_details_dev_patch.py'

permissions:
  contents: write

jobs:
  port-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-dev
          fetch-depth: 0
      - name: Fetch main feature branch
        run: git fetch origin feature/cleaning-suite-main:refs/remotes/origin/feature/cleaning-suite-main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Port recurring details files from main
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart
            lib/features/orders/view/widgets/cleaning_recurring_schedule_launcher_widget.dart
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart
            test/features/orders/data/models/cleaning_recurring_schedule_model_test.dart
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/feature/cleaning-suite-main:$file" > "$file"
          done
          python scripts/port_recurring_details_dev_patch.py
      - name: Format port
        run: |
          dart format \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart \
            lib/features/orders/view/widgets/cleaning_recurring_schedule_launcher_widget.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart \
            test/features/orders/data/models/cleaning_recurring_schedule_model_test.dart
      - name: Analyze recurring details
        run: |
          flutter analyze \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart \
            lib/features/orders/view/widgets/cleaning_recurring_schedule_launcher_widget.dart
      - name: Run recurring details tests
        run: |
          flutter test \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart \
            test/features/orders/data/models/cleaning_recurring_schedule_model_test.dart \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart
      - name: Commit dev port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart \
            lib/features/orders/view/widgets/cleaning_recurring_schedule_launcher_widget.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart \
            test/features/orders/data/models/cleaning_recurring_schedule_model_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(cleaning): port recurring details and skip to dev"
          git push origin HEAD:feature/cleaning-suite-dev
