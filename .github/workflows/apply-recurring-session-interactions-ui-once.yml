name: Apply Recurring Session Interaction UI Once

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - 'scripts/apply_recurring_session_interactions_ui_patch.py'
      - '.github/workflows/apply-recurring-session-interactions-ui-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply bounded patch
        run: python3 scripts/apply_recurring_session_interactions_ui_patch.py

      - name: Format changed Dart
        run: |
          dart format \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart

      - name: Analyze changed sources
        run: |
          flutter analyze \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart

      - name: Run interaction model tests
        run: flutter test test/features/orders/data/models/cleaning_booking_schedule_model_test.dart

      - name: Commit verified feature files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart
          git diff --cached --quiet && exit 1
          git commit -m 'feat(cleaning): add per-session settlement review and dispute UI'
          git push origin HEAD:feature/cleaning-suite-main
