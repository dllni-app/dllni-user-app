name: Cleaning Worker Tracking

on:
  pull_request:
    paths:
      - 'lib/core/realtime/cleaning_booking_pusher_service.dart'
      - 'lib/core/realtime/cleaning_realtime_contract.dart'
      - 'lib/core/realtime/cleaning_tracking_session_bus.dart'
      - 'lib/features/orders/view/helpers/cleaning_order_polling_equality.dart'
      - 'lib/features/orders/view/widgets/cleaning_worker_tracking_map.dart'
      - 'test/core/realtime/cleaning_realtime_location_bus_test.dart'
      - 'test/core/realtime/cleaning_tracking_session_bus_test.dart'
      - 'test/features/orders/view/helpers/cleaning_order_polling_equality_test.dart'
      - '.github/workflows/cleaning-worker-tracking.yml'

jobs:
  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/core/realtime/cleaning_booking_pusher_service.dart lib/core/realtime/cleaning_tracking_session_bus.dart lib/features/orders/view/helpers/cleaning_order_polling_equality.dart lib/features/orders/view/widgets/cleaning_worker_tracking_map.dart test/core/realtime/cleaning_tracking_session_bus_test.dart test/features/orders/view/helpers/cleaning_order_polling_equality_test.dart

      - name: Analyze tracking sources
        run: flutter analyze lib/core/realtime/cleaning_booking_pusher_service.dart lib/core/realtime/cleaning_tracking_session_bus.dart lib/features/orders/view/helpers/cleaning_order_polling_equality.dart lib/features/orders/view/widgets/cleaning_worker_tracking_map.dart

      - name: Run tracking tests
        run: flutter test test/core/realtime/cleaning_realtime_location_bus_test.dart test/core/realtime/cleaning_tracking_session_bus_test.dart test/features/orders/view/helpers/cleaning_order_polling_equality_test.dart
