name: Validate Order Created At Format

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'lib/features/orders/view/helpers/order_date_time_formatter.dart'
      - 'lib/features/orders/view/widgets/restaurant_order_details_card.dart'
      - 'lib/features/orders/view/widgets/restaurant_order_tracking_view.dart'
      - 'lib/features/sm_orders/view/widgets/order_info_card.dart'
      - 'test/features/orders/view/helpers/order_date_time_formatter_test.dart'
      - '.github/workflows/validate-order-created-at-format.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run formatter test
        run: flutter test test/features/orders/view/helpers/order_date_time_formatter_test.dart

      - name: Analyze changed Dart files
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/features/orders/view/helpers/order_date_time_formatter.dart
          lib/features/orders/view/widgets/restaurant_order_details_card.dart
          lib/features/orders/view/widgets/restaurant_order_tracking_view.dart
          lib/features/sm_orders/view/widgets/order_info_card.dart
          test/features/orders/view/helpers/order_date_time_formatter_test.dart
