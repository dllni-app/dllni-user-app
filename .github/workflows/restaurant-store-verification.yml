name: Restaurant and Store Verification

on:
  push:
    branches: [dev, main, apple]
    paths:
      - '.github/workflows/restaurant-store-verification.yml'
      - 'lib/core/app_config.dart'
      - 'lib/core/deeplink/**'
      - 'lib/features/orders/**'
      - 'lib/features/delivery/**'
      - 'lib/features/rs_discover/**'
      - 'lib/features/rs_home/**'
      - 'lib/features/profile/view/screens/lucky_box_suggestions_screen.dart'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze modified user features
        run: >-
          flutter analyze
          lib/core/app_config.dart
          lib/core/deeplink/deep_link_parser.dart
          lib/core/deeplink/deep_link_service.dart
          lib/features/orders/data/models/orders_api_models.dart
          lib/features/orders/view/screens/orders_screen.dart
          lib/features/orders/view/screens/restaurant_order_tracking_screen.dart
          lib/features/orders/view/widgets/restaurant_order_status_stepper.dart
          lib/features/delivery/presentation/widgets/delivery_status_stepper.dart
          lib/features/orders/view/widgets/restaurant_cart_add_more_products_button.dart
          lib/features/orders/view/widgets/restaurant_cart_checkout_body.dart
          lib/features/orders/view/widgets/restaurant_cart_product_card.dart
          lib/features/rs_discover/view/screens/rs_discover_screen.dart
          lib/features/rs_home/view/widgets/exclusive_offers_section.dart
          lib/features/profile/view/screens/lucky_box_suggestions_screen.dart
