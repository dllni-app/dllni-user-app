name: Restaurant and Store Verification

on:
  push:
    branches: [dev, main, apple, fix/restaurant-user-flow-audit]
    paths:
      - '.github/workflows/restaurant-store-verification.yml'
      - 'lib/core/app_config.dart'
      - 'lib/core/deeplink/**'
      - 'lib/features/orders/**'
      - 'lib/features/delivery/**'
      - 'lib/features/rs_discover/**'
      - 'lib/features/rs_home/**'
      - 'lib/features/profile/view/screens/lucky_box_suggestions_screen.dart'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze restaurant user flow
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/features/orders
          lib/features/rs_discover
          lib/features/rs_home
          test/features/restaurant/restaurant_user_flow_contract_test.dart

      - name: Test restaurant user flow contracts
        run: flutter test test/features/restaurant/restaurant_user_flow_contract_test.dart
