name: Validate Product Details Recommendations

on:
  pull_request:
    paths:
      - 'lib/features/rs_discover/data/models/fetch_restaurant_product_details_model.dart'
      - 'lib/features/rs_discover/domain/usecases/fetch_restaurant_products_search_use_case.dart'
      - 'lib/features/rs_discover/view/screens/rs_product_details_screen.dart'
      - 'lib/features/rs_discover/view/widgets/product_recommendations_section.dart'
      - 'lib/features/sm_stores/view/screens/sm_product_details_screen.dart'
      - '.github/workflows/validate-product-details-recommendations.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze changed Dart files
        run: >-
          flutter analyze
          lib/features/rs_discover/data/models/fetch_restaurant_product_details_model.dart
          lib/features/rs_discover/domain/usecases/fetch_restaurant_products_search_use_case.dart
          lib/features/rs_discover/view/screens/rs_product_details_screen.dart
          lib/features/rs_discover/view/widgets/product_recommendations_section.dart
          lib/features/sm_stores/view/screens/sm_product_details_screen.dart
