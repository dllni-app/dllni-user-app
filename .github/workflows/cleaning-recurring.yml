# Check-only recurring cleaning verification. This workflow must never modify repository content.
name: Cleaning Recurring User

on:
  push:
    branches:
      - feature/cleaning-suite-main
      - feature/cleaning-suite-dev
    paths:
      - 'lib/features/cl_main/domain/models/cleaning_recurring_session.dart'
      - 'lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart'
      - 'lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart'
      - 'lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart'
      - 'lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart'
      - 'lib/features/orders/data/models/cleaning_booking_schedule_model.dart'
      - 'lib/features/orders/data/source/cleaning_session_remote_data_source.dart'
      - 'lib/features/orders/view/screens/cleaning_order_details_screen.dart'
      - 'lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart'
      - 'lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart'
      - 'lib/features/orders/view/widgets/cleaning_recurring_schedule_launcher_widget.dart'
      - 'test/features/cl_main/domain/models/cleaning_recurring_session_test.dart'
      - 'test/features/cl_main/domain/usecases/create_cleaning_order_use_case_test.dart'
      - 'test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart'
      - 'test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart'
      - 'test/features/orders/data/models/cleaning_booking_schedule_model_test.dart'
      - 'test/features/orders/data/models/cleaning_recurring_schedule_model_test.dart'
      - '.github/workflows/cleaning-recurring.yml'
  pull_request:
    paths:
      - 'lib/features/cl_main/domain/models/cleaning_recurring_session.dart'
      - 'lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart'
      - 'lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart'
      - 'lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart'
      - 'lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart'
      - 'lib/features/orders/data/models/cleaning_booking_schedule_model.dart'
      - 'lib/features/orders/data/source/cleaning_session_remote_data_source.dart'
      - 'lib/features/orders/view/screens/cleaning_order_details_screen.dart'
      - 'lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart'
      - 'lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart'
      - 'lib/features/orders/view/widgets/cleaning_recurring_schedule_launcher_widget.dart'
      - 'test/features/cl_main/domain/models/cleaning_recurring_session_test.dart'
      - 'test/features/cl_main/domain/usecases/create_cleaning_order_use_case_test.dart'
      - 'test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart'
      - 'test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart'
      - 'test/features/orders/data/models/cleaning_booking_schedule_model_test.dart'
      - 'test/features/orders/data/models/cleaning_recurring_schedule_model_test.dart'
      - '.github/workflows/cleaning-recurring.yml'

permissions:
  contents: read

jobs:
  recurring-cleaning:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart \
            lib/features/orders/view/widgets/cleaning_recurring_schedule_launcher_widget.dart \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/create_cleaning_order_use_case_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart \
            test/features/orders/data/models/cleaning_recurring_schedule_model_test.dart

      - name: Analyze recurring cleaning sources
        run: |
          flutter analyze \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart \
            lib/features/orders/view/widgets/cleaning_recurring_schedule_launcher_widget.dart

      - name: Run recurring cleaning tests
        run: |
          flutter test \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/create_cleaning_order_use_case_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart \
            test/features/orders/data/models/cleaning_recurring_schedule_model_test.dart
