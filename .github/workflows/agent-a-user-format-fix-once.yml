name: Agent A User Format Fix Once

on:
  push:
    branches:
      - feature/cleaning-suite-agent-a-main-closeout
    paths:
      - '.github/workflows/agent-a-user-format-fix-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format closeout files
        run: |
          dart format \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_reschedule_screen.dart \
            test/features/orders/data/models/cleaning_attendance_action_contract_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_reschedule_screen.dart \
            test/features/orders/data/models/cleaning_attendance_action_contract_test.dart
          git commit -m "style(cleaning): format Agent A user closeout files"
          git push origin HEAD:feature/cleaning-suite-agent-a-main-closeout
