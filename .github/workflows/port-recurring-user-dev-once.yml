name: Port Recurring User Dev Once

on:
  push:
    branches:
      - feature/cleaning-suite-dev
    paths:
      - '.github/workflows/port-recurring-user-dev-once.yml'

permissions:
  contents: write

jobs:
  port-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-dev
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Port recurring creation slice from main
        run: |
          git fetch origin feature/cleaning-suite-main
          git checkout origin/feature/cleaning-suite-main -- \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart
      - name: Format recurring dev slice
        run: |
          dart format \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart
      - name: Analyze recurring dev slice
        run: |
          flutter analyze \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart
      - name: Run recurring dev tests
        run: |
          flutter test \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/create_cleaning_order_use_case_test.dart \
            test/features/cl_main/domain/usecases/estimate_cleaning_price_use_case_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart
      - name: Commit recurring dev slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(cleaning): port recurring creation patterns to dev"
          git push origin HEAD:feature/cleaning-suite-dev
