name: Cleaning Suite User

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/cleaning-suite.yml'

permissions:
  contents: write

jobs:
  event-customer-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore proven multi-day reschedule screen
        run: |
          git fetch origin multiday-dev --depth=1
          git show FETCH_HEAD:lib/features/orders/view/screens/multi_day_cleaning_order_reschedule_screen.dart > lib/features/orders/view/screens/multi_day_cleaning_order_reschedule_screen.dart

      - name: Apply customer event UI patch
        run: python3 .github/scripts/finalize_event_customer_ui.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format customer event sources
        run: |
          dart format \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_reschedule_screen.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart

      - name: Analyze customer event sources
        run: |
          flutter analyze --no-fatal-infos \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_reschedule_screen.dart

      - name: Run event model tests
        run: flutter test test/features/orders/data/models/cleaning_booking_schedule_model_test.dart

      - name: Restore check-only CI and commit customer UI
        run: |
          git checkout 0db7511dad21f41a157f03e290e7a5818202c94c -- .github/workflows/cleaning-suite.yml
          git rm .github/scripts/finalize_event_customer_ui.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cleaning): enable customer event day rescheduling'
          git push
