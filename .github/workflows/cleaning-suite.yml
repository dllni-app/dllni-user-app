name: Cleaning Suite User

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/cleaning-suite.yml'

permissions:
  contents: write

jobs:
  event-review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply event review UI patch
        run: python3 .github/scripts/finalize_event_review_ui.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed event review sources
        run: |
          dart format \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/domain/usecases/submit_cleaning_review_use_case.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart \
            test/features/orders/data/models/cleaning_event_review_state_test.dart \
            test/features/orders/domain/usecases/submit_cleaning_review_use_case_test.dart

      - name: Analyze changed event review sources
        run: |
          flutter analyze \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/domain/usecases/submit_cleaning_review_use_case.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_screen.dart

      - name: Run event review tests
        run: |
          flutter test \
            test/features/orders/data/models/cleaning_event_review_state_test.dart \
            test/features/orders/domain/usecases/submit_cleaning_review_use_case_test.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart

      - name: Commit implementation
        run: |
          git rm .github/scripts/finalize_event_review_ui.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cleaning): add one rating after multi-day event completion'
          git push
