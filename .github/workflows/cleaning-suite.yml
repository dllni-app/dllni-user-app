name: Cleaning Suite User

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - 'lib/features/cl_main/data/models/estimate_price_response_model.dart'
      - 'lib/features/cl_main/domain/models/cleaning_event_session.dart'
      - 'lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart'
      - 'lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart'
      - 'test/features/cl_main/data/models/estimate_price_response_model_test.dart'
      - 'test/features/cl_main/domain/usecases/multi_day_event_request_serialization_test.dart'
      - '.github/workflows/cleaning-suite.yml'
  pull_request:
    paths:
      - 'lib/features/cl_main/data/models/estimate_price_response_model.dart'
      - 'lib/features/cl_main/domain/models/cleaning_event_session.dart'
      - 'lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart'
      - 'lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart'
      - 'test/features/cl_main/data/models/estimate_price_response_model_test.dart'
      - 'test/features/cl_main/domain/usecases/multi_day_event_request_serialization_test.dart'
      - '.github/workflows/cleaning-suite.yml'

permissions:
  contents: write

jobs:
  multi-day-event:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format multi-day event sources
        run: |
          dart format \
            lib/features/cl_main/data/models/estimate_price_response_model.dart \
            lib/features/cl_main/domain/models/cleaning_event_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            test/features/cl_main/domain/usecases/multi_day_event_request_serialization_test.dart

      - name: Commit formatter output
        if: github.event_name == 'push'
        shell: bash
        run: |
          git add \
            lib/features/cl_main/data/models/estimate_price_response_model.dart \
            lib/features/cl_main/domain/models/cleaning_event_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            test/features/cl_main/domain/usecases/multi_day_event_request_serialization_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(cleaning): format user multi-day sources'
          git push

      - name: Analyze multi-day event sources
        run: |
          flutter analyze \
            lib/features/cl_main/data/models/estimate_price_response_model.dart \
            lib/features/cl_main/domain/models/cleaning_event_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart

      - name: Run multi-day event tests
        run: |
          flutter test \
            test/features/cl_main/data/models/estimate_price_response_model_test.dart \
            test/features/cl_main/domain/usecases/multi_day_event_request_serialization_test.dart
