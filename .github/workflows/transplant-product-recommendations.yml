name: Transplant Product Recommendations

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/transplant-product-recommendations.yml'

permissions:
  contents: write

jobs:
  transplant:
    if: github.head_ref == 'agent/product-details-recommendations-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature target branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-details-recommendations-dev
          fetch-depth: 0

      - name: Apply recommendation feature diff onto dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/product-details-recommendations dev
          git diff --full-index --binary 0064af5efc3aaedd2046631e72f894566ef292a0..origin/agent/product-details-recommendations -- \
            lib/features/rs_discover/data/models/fetch_restaurant_product_details_model.dart \
            lib/features/rs_discover/domain/usecases/fetch_restaurant_products_search_use_case.dart \
            lib/features/rs_discover/view/screens/rs_product_details_screen.dart \
            lib/features/rs_discover/view/widgets/product_recommendations_section.dart \
            lib/features/sm_stores/view/screens/sm_product_details_screen.dart \
            > /tmp/product-recommendations.patch
          git apply --3way --index /tmp/product-recommendations.patch
          git rm .github/workflows/transplant-product-recommendations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add product recommendations to details screens"
          git push origin HEAD:agent/product-details-recommendations-dev
