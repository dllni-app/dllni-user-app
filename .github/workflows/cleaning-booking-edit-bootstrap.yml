name: Cleaning Booking Edit Bootstrap

on:
  push:
    branches:
      - agent/cleaning-booking-edit-api

permissions:
  contents: write

jobs:
  verify-and-apply:
    if: ${{ !contains(github.event.head_commit.message, '[cleaning-edit-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/cleaning-booking-edit-api
          fetch-depth: 0

      - name: Apply prepared integration patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-cleaning-booking-edit.yml').read_text()
          marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          body = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          )
          exec(compile(code, 'apply-cleaning-booking-edit.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: >-
          dart format
          lib/features/orders/data/models/cleaning_orders_api_models.dart
          lib/features/orders/domain/usecases/patch_cleaning_order_use_case.dart
          lib/features/orders/view/helpers/cleaning_rebook_policy.dart
          lib/features/orders/view/screens/cleaning_order_details_screen.dart
          lib/features/orders/view/screens/cleaning_order_reschedule_screen.dart
          lib/features/cl_main/view/widgets/cl_service_gender_preference_section_widget.dart
          test/features/orders/data/models/cleaning_booking_editability_test.dart
          test/features/orders/domain/usecases/patch_cleaning_order_use_case_test.dart
          test/features/orders/view/helpers/cleaning_rebook_policy_test.dart

      - name: Analyze touched Flutter sources
        run: >-
          flutter analyze
          lib/features/orders/data/models/cleaning_orders_api_models.dart
          lib/features/orders/domain/usecases/patch_cleaning_order_use_case.dart
          lib/features/orders/view/helpers/cleaning_rebook_policy.dart
          lib/features/orders/view/screens/cleaning_order_details_screen.dart
          lib/features/orders/view/screens/cleaning_order_reschedule_screen.dart
          lib/features/cl_main/view/widgets/cl_service_gender_preference_section_widget.dart

      - name: Run focused cleaning edit tests
        run: >-
          flutter test
          test/features/orders/data/models/cleaning_booking_editability_test.dart
          test/features/orders/domain/usecases/patch_cleaning_order_use_case_test.dart
          test/features/orders/view/helpers/cleaning_rebook_policy_test.dart

      - name: Commit verified integration
        shell: bash
        run: |
          rm -f .github/workflows/apply-cleaning-booking-edit.yml
          rm -f .github/workflows/apply-cleaning-booking-edit-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/features/orders/data/models/cleaning_orders_api_models.dart \
            lib/features/orders/view/screens/cleaning_order_details_screen.dart \
            lib/features/orders/view/screens/cleaning_order_reschedule_screen.dart \
            .github/workflows/apply-cleaning-booking-edit.yml \
            .github/workflows/apply-cleaning-booking-edit-pr.yml
          git commit -m "[cleaning-edit-applied] Wire cleaning booking edit API into Flutter"
          git push origin HEAD:agent/cleaning-booking-edit-api
