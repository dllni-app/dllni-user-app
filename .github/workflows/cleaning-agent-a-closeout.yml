name: Cleaning Agent A User Closeout

on:
  push:
    branches:
      - feature/cleaning-suite-agent-a-main-closeout
      - feature/cleaning-suite-agent-a-dev-closeout
    paths:
      - 'lib/features/orders/data/models/cleaning_booking_schedule_model.dart'
      - 'lib/features/orders/data/source/cleaning_session_remote_data_source.dart'
      - 'lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart'
      - 'lib/features/orders/view/screens/multi_day_cleaning_order_reschedule_screen.dart'
      - 'test/features/orders/data/models/cleaning_booking_schedule_model_test.dart'
      - 'test/features/orders/data/models/cleaning_attendance_action_contract_test.dart'
      - '.github/workflows/cleaning-agent-a-closeout.yml'

jobs:
  multi-day-session-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_reschedule_screen.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart \
            test/features/orders/data/models/cleaning_attendance_action_contract_test.dart
      - name: Analyze closeout sources
        run: |
          flutter analyze \
            lib/features/orders/data/models/cleaning_booking_schedule_model.dart \
            lib/features/orders/data/source/cleaning_session_remote_data_source.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_details_content.dart \
            lib/features/orders/view/screens/multi_day_cleaning_order_reschedule_screen.dart
      - name: Run closeout tests
        run: |
          flutter test \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart \
            test/features/orders/data/models/cleaning_attendance_action_contract_test.dart
