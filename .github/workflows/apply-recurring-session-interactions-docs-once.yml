name: Apply Recurring Session Interaction Docs Once

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - 'scripts/apply_recurring_session_interactions_docs_patch.py'
      - '.github/workflows/apply-recurring-session-interactions-docs-once.yml'

permissions:
  contents: write

jobs:
  apply-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-main

      - name: Apply bounded docs patch
        run: python scripts/apply_recurring_session_interactions_docs_patch.py

      - name: Commit docs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cleaning-suite-port-map.md
          if git diff --cached --quiet; then
            echo 'No docs changes required.'
            exit 0
          fi
          git commit -m 'docs(cleaning): record recurring per-session interaction parity'
          git push origin HEAD:feature/cleaning-suite-main
