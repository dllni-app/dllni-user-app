name: Validate Hidden Main Search

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'lib/features/home/view/screens/home_screen.dart'
      - 'lib/features/rs_home/view/widgets/home_app_bar.dart'
      - '.github/workflows/validate-hide-main-search.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze changed Dart files
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/features/home/view/screens/home_screen.dart
          lib/features/rs_home/view/widgets/home_app_bar.dart
