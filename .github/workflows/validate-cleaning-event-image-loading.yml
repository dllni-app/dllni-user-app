name: Validate Cleaning Event Image Loading

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'lib/features/cl_main/view/widgets/cl_property_type_card_widget.dart'
      - 'lib/features/cl_main/view/widgets/cl_occasion_type_card_widget.dart'
      - '.github/workflows/validate-cleaning-event-image-loading.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze changed Dart files
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/features/cl_main/view/widgets/cl_property_type_card_widget.dart lib/features/cl_main/view/widgets/cl_occasion_type_card_widget.dart
