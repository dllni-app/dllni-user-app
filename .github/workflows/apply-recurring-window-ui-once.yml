name: Apply Recurring Window UI Once

on:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/apply-recurring-window-ui-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply recurring window guards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart')
          text = path.read_text()
          replacements = [
              (
                  "    if (!_isRecurring || _recurringSessions.length < 2) {\n      return const <CleaningRecurringSessionInput>[];\n    }",
                  "    if (!_isRecurring ||\n        _recurringSessions.length < 2 ||\n        _recurringSessions.exceedsMaxWindow) {\n      return const <CleaningRecurringSessionInput>[];\n    }",
              ),
              (
                  "    _applyRecurringSessions(<CleaningRecurringSessionInput>[\n      ..._recurringSessions,\n      next,\n    ]);",
                  "    final proposed = <CleaningRecurringSessionInput>[\n      ..._recurringSessions,\n      next,\n    ];\n    if (proposed.exceedsMaxWindow) {\n      _showRecurringWindowLimit();\n      return;\n    }\n\n    _applyRecurringSessions(proposed);",
              ),
              (
                  "    edited[index] = replacement;\n    _applyRecurringSessions(edited);",
                  "    edited[index] = replacement;\n    if (edited.exceedsMaxWindow) {\n      _showRecurringWindowLimit();\n      return;\n    }\n    _applyRecurringSessions(edited);",
              ),
              (
                  "  void _requestRecurringEstimateIfPossible() {\n    if (!_isRecurring || _recurringSessions.length < 2) return;",
                  "  void _requestRecurringEstimateIfPossible() {\n    if (!_isRecurring ||\n        _recurringSessions.length < 2 ||\n        _recurringSessions.exceedsMaxWindow) {\n      return;\n    }",
              ),
              (
                  "  void _showDuplicateRecurringVisit() {\n    ScaffoldMessenger.of(context).showSnackBar(\n      const SnackBar(\n        content: Text('لا يمكن إضافة نفس تاريخ ووقت الزيارة مرتين.'),\n      ),\n    );\n  }",
                  "  void _showDuplicateRecurringVisit() {\n    ScaffoldMessenger.of(context).showSnackBar(\n      const SnackBar(\n        content: Text('لا يمكن إضافة نفس تاريخ ووقت الزيارة مرتين.'),\n      ),\n    );\n  }\n\n  void _showRecurringWindowLimit() {\n    ScaffoldMessenger.of(context).showSnackBar(\n      const SnackBar(\n        content: Text(\n          'يجب أن تقع جميع زيارات الحجز الدوري ضمن فترة لا تتجاوز 30 يوماً.',\n        ),\n      ),\n    );\n  }",
              ),
              (
                  "    if (_isRecurring && _recurringSessions.length < 2) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(\n          content: Text('الحجز الدوري يحتاج إلى زيارتين على الأقل.'),\n        ),\n      );\n      return;\n    }",
                  "    if (_isRecurring && _recurringSessions.length < 2) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(\n          content: Text('الحجز الدوري يحتاج إلى زيارتين على الأقل.'),\n        ),\n      );\n      return;\n    }\n\n    if (_isRecurring && _recurringSessions.exceedsMaxWindow) {\n      _showRecurringWindowLimit();\n      return;\n    }",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format recurring sources
        run: |
          dart format \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart
      - name: Analyze recurring sources
        run: |
          flutter analyze \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart
      - name: Run recurring tests
        run: |
          flutter test \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/create_cleaning_order_use_case_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart \
            test/features/orders/data/models/cleaning_booking_schedule_model_test.dart \
            test/features/orders/data/models/cleaning_recurring_schedule_model_test.dart
      - name: Commit recurring window UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(cleaning): enforce recurring window in user flow"
          git push origin HEAD:feature/cleaning-suite-main
