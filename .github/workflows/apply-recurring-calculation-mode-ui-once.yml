name: Apply Recurring Calculation Mode UI Once

on:
  workflow_dispatch:
  push:
    branches:
      - feature/cleaning-suite-main
    paths:
      - '.github/workflows/apply-recurring-calculation-mode-ui-once.yml'
      - 'scripts/apply_recurring_calculation_mode_ui_patch.py'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/cleaning-suite-main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply recurring task-hour UI patch
        run: |
          python3 scripts/apply_recurring_calculation_mode_ui_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/cl_main/domain/models/cleaning_recurring_session.dart')
          text = path.read_text()
          old = """    return <String, dynamic>{
                'mode': 'recurring',
                'calculationMode': calculationMode.apiValue,
                if (normalizedHours != null) 'hoursPerVisit': normalizedHours,
                'sessions': items.map((item) => item.toJson()).toList(growable: false),
              };
          """
          # The source generated by the patch uses two-space map indentation.
          if old not in text:
              old = """    return <String, dynamic>{
      'mode': 'recurring',
      'calculationMode': calculationMode.apiValue,
      if (normalizedHours != null) 'hoursPerVisit': normalizedHours,
      'sessions': items.map((item) => item.toJson()).toList(growable: false),
    };
          """
          new = """    final schedule = <String, dynamic>{
      'mode': 'recurring',
      'calculationMode': calculationMode.apiValue,
      'sessions': items.map((item) => item.toJson()).toList(growable: false),
    };
    if (normalizedHours != null) {
      schedule['hoursPerVisit'] = normalizedHours;
    }
    return schedule;
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one recurring schedule map, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: |
          dart format \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart

      - name: Analyze
        run: |
          flutter analyze \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart

      - name: Test recurring task-hour UI contract
        run: |
          flutter test \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/features/cl_main/domain/models/cleaning_recurring_session.dart \
            lib/features/cl_main/domain/usecases/create_cleaning_order_use_case.dart \
            lib/features/cl_main/domain/usecases/estimate_cleaning_price_use_case.dart \
            lib/features/cl_main/view/screens/cl_main_service_schedule_screen.dart \
            lib/features/cl_main/view/widgets/cl_recurring_schedule_section_widget.dart \
            test/features/cl_main/domain/models/cleaning_recurring_session_test.dart \
            test/features/cl_main/domain/usecases/recurring_cleaning_request_serialization_test.dart \
            test/features/cl_main/view/widgets/cl_recurring_schedule_section_widget_test.dart
          if git diff --cached --quiet; then
            echo 'No feature changes to commit.'
            exit 0
          fi
          git commit -m 'feat(cleaning): add task and hour recurring booking modes'
          git push origin HEAD:feature/cleaning-suite-main
